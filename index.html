<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>猪猪游乐场</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --bd: #2d323e; --fg: #fff; --dim: #8b949e;
    --acc: #ff9800; --ok: #4caf50; --bad: #f44336; --gold: #ffeb3b;
  }
  body.light { --bg: #f6f8fa; --card: #fff; --bd: #d0d7de; --fg: #24292f; --dim: #57606a; }
  body.pink { --bg: #fff0f5; --card: #fff; --bd: #ffcce0; --fg: #5a2a3d; --dim: #a87a90; --acc: #ff5599; }
  body.blue { --bg: #0a1628; --card: #0f1f38; --bd: #1e3a5f; --fg: #d6e8ff; --dim: #8bb4d4; --acc: #00a8ff; }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { min-height: 100vh; background: var(--bg); color: var(--fg); line-height: 1.6; transition: background .3s, color .3s; overflow-x: hidden; }

  header { background: var(--card); border-bottom: 2px solid var(--acc); position: sticky; top: 0; z-index: 100; padding: 10px 0; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
  .logo span { color: var(--acc); }
  
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { position: relative; background: var(--bg); border: 1px solid var(--bd); border-radius: 20px; padding: 5px 14px; font-size: .85rem; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: .2s; }
  .chip:hover { border-color: var(--acc); }
  .chip .val { color: var(--acc); font-weight: 900; }
  .chip .tip { position: absolute; top: 120%; right: 0; width: 240px; background: var(--card); border: 1px solid var(--acc); border-radius: 12px; padding: 12px; font-size: .8rem; box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; visibility: hidden; transform: translateY(-10px); transition: .2s; z-index: 200; text-align: left; font-weight: normal; line-height: 1.6; }
  .chip:hover .tip { opacity: 1; visibility: visible; transform: translateY(0); }
  .tip h4 { color: var(--acc); margin-bottom: 8px; font-size: .9rem; }
  .tip .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .tip .row b { color: var(--acc); }

  .themebar { display: flex; gap: 4px; background: var(--bg); border-radius: 20px; padding: 3px; border: 1px solid var(--bd); }
  .themebar button { border: none; background: transparent; padding: 4px 8px; border-radius: 14px; cursor: pointer; font-size: 1rem; transition: .2s; }
  .themebar button.on { background: var(--acc); color: #fff; }

  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  .hero { text-align: center; margin-bottom: 24px; }
  .hero h1 { font-size: 1.8rem; color: var(--acc); margin-bottom: 4px; letter-spacing: 2px; }
  .hero p { color: var(--dim); font-size: .9rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 1.2rem 1rem; cursor: pointer; transition: .2s; text-align: left; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
  .card:hover { border-color: var(--acc); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 152, 0, 0.15); }
  .card .em { font-size: 2rem; }
  .card .nm { font-size: 1rem; font-weight: 800; color: var(--acc); }
  .card .ds { font-size: .75rem; color: var(--dim); line-height: 1.4; }
  .card.hot::after { content: 'HOT'; position: absolute; top: 8px; right: 8px; background: linear-gradient(135deg, #ff5500, #ff9800); color: #fff; font-size: .55rem; font-weight: 900; padding: 1px 6px; border-radius: 6px; }
  .card.new::after { content: 'NEW'; position: absolute; top: 8px; right: 8px; background: linear-gradient(135deg, #00a8ff, #4dd0ff); color: #000; font-size: .55rem; font-weight: 900; padding: 1px 6px; border-radius: 6px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(4px); z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.on { display: flex; }
  .panel { background: var(--card); border: 2px solid var(--acc); border-radius: 16px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.5rem; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,.6); animation: pIn .3s ease; }
  @keyframes pIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel .close { position: absolute; top: 12px; right: 16px; background: transparent; border: none; font-size: 1.8rem; color: var(--dim); cursor: pointer; }
  .panel .close:hover { color: var(--acc); }
  .panel .head { border-bottom: 2px dashed var(--bd); padding-bottom: 12px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; }
  .panel .head .em { font-size: 2.2rem; }
  .panel .head h3 { color: var(--acc); font-size: 1.2rem; }

  .info { background: var(--bg); border: 1px solid var(--bd); border-radius: 10px; padding: 10px 12px; font-size: .85rem; margin-bottom: 12px; line-height: 1.6; }
  .info b { color: var(--acc); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .row.center { justify-content: center; }
  .btn { background: var(--acc); border: none; padding: 8px 18px; border-radius: 20px; color: #fff; font-weight: 700; cursor: pointer; font-size: .9rem; transition: .1s; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.95); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn.sec { background: #555; }
  .btn.grn { background: var(--ok); }
  .btn.dan { background: var(--bad); }
  .log { background: var(--bg); border: 1px dashed var(--bd); border-radius: 10px; padding: 12px; font-size: .85rem; max-height: 180px; overflow-y: auto; white-space: pre-wrap; line-height: 1.8; margin-bottom: 12px; }
  .log .ok { color: var(--ok); } .log .bad { color: var(--bad); } .log .big { color: var(--gold); font-weight: 800; }
  
  .big { text-align: center; font-size: 2.2rem; font-weight: 900; color: var(--acc); margin: 16px 0; }
  
  .dice-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
  .die { width: 46px; height: 46px; background: #fff; color: #000; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; border: 2px solid transparent; cursor: pointer; user-select: none; box-shadow: 0 4px 8px rgba(0,0,0,.3); }
  .die.held { border-color: var(--acc); background: #fff8e0; transform: translateY(-4px); }

  .reels { display: flex; gap: 10px; justify-content: center; margin: 16px 0; }
  .reel { width: 70px; height: 80px; background: var(--bg); border: 2px solid var(--bd); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; transition: .1s; }
  .reel.win { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }

  .pcard { width: 50px; height: 75px; background: #fff; color: #000; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 1.2rem; box-shadow: 0 4px 8px rgba(0,0,0,.3); }
  .pcard .suit { font-size: .9rem; } .pcard.red { color: #d32f2f; }
  .pcard.back { background: #4a2a5a; color: var(--gold); border: 1px solid #2a1a3a; }

  .res { text-align: center; padding: 16px; background: var(--bg); border: 1px dashed var(--bd); border-radius: 12px; margin: 12px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .res .em { font-size: 2.5rem; }
  .res .nm { font-weight: 800; color: var(--acc); font-size: 1.1rem; }
  .res .ds { font-size: .8rem; color: var(--dim); }

  .toasts { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 280px; }
  .toast { background: var(--card); border: 2px solid var(--acc); border-radius: 12px; padding: 10px 14px; font-size: .85rem; font-weight: 700; box-shadow: 0 8px 20px rgba(0,0,0,.4); animation: tIn .3s ease; display: flex; align-items: center; gap: 8px; }
  .toast.ok { border-color: var(--ok); } .toast.bad { border-color: var(--bad); }
  .toast.big { border-color: var(--gold); }
  @keyframes tIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .toast.out { animation: tOut .3s ease forwards; }
  @keyframes tOut { to { transform: translateX(30px); opacity: 0; } }

  @media (max-width: 600px) {
    .wrap { flex-direction: column; align-items: stretch; }
    .chips { justify-content: center; }
    .tip { right: auto; left: 50%; transform: translateX(-50%) translateY(-10px); }
    .chip:hover .tip { transform: translateX(-50%) translateY(0); }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .toasts { left: 16px; right: 16px; max-width: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">🐖 猪猪<span>游乐场</span></div>
    <div class="chips">
      <div class="chip" id="chipWallet">🪙 <span class="val" id="vWallet">1000</span><div class="tip" id="tipWallet"></div></div>
      <div class="chip" id="chipWeather">☀️ <span id="vWeather">晴朗</span> <span class="val" id="vMul">x1.00</span><div class="tip" id="tipWeather"></div></div>
      <div class="themebar" id="themebar">
        <button data-t="dark">🌙</button>
        <button data-t="light">☀️</button>
        <button data-t="pink">🌸</button>
        <button data-t="blue">💙</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h1>🎰 猪猪游乐场</h1>
    <p>悬停右上角查看金币流水与天气详情 · 点击卡片开始游戏</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="panel">
    <button class="close" id="pClose">×</button>
    <div class="head">
      <span class="em" id="pEmoji">🎲</span>
      <div>
        <h3 id="pTitle">标题</h3>
        <div style="font-size:.8rem;color:var(--dim)" id="pSub">副标题</div>
      </div>
    </div>
    <div id="pBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
/* ==================== 安全存储 ==================== */
const LS = (() => {
  try { const t = window.localStorage; t.setItem('_t', '1'); t.removeItem('_t'); return t; }
  catch (e) { const m = {}; return { getItem: k => m[k] || null, setItem: (k, v) => m[k] = String(v) }; }
})();

/* ==================== 工具 ==================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ==================== 状态 ==================== */
const KEY = 'piggy-v3';
const state = { wallet: 1000, income: 0, outcome: 0, flow: [], weather: null, inv: {}, pigs: null, lotto: null, pranks: 0 };
try { Object.assign(state, JSON.parse(LS.getItem(KEY)) || {}); } catch (e) {}
const save = () => LS.setItem(KEY, JSON.stringify(state));

/* ==================== 天气系统 ==================== */
const WEATHERS = {
  sunny: { icon: '☀️', name: '晴朗', mul: 1.0, desc: '风和日丽，一切正常', extras: [] },
  rain: { icon: '🌧️', name: '暴雨', mul: 1.15, desc: '猪猪变得慷慨', extras: [{ game: 'adventure', mul: 2, label: '「大冒险」收益 ×2' }] },
  fog: { icon: '🌫️', name: '浓雾', mul: 0.9, desc: '惊喜藏在雾里', extras: [{ rare: 'gacha', label: '「扭蛋机」稀有概率提升' }, { rare: 'alchemy', label: '「炼金锅」彩蛋概率提升' }] },
  storm: { icon: '⛈️', name: '雷暴', mul: 1.3, desc: '冒险家狂欢', extras: [{ game: 'roulette', mul: 2, label: '「轮盘」收益 ×2' }, { game: 'bj', mul: 2, label: '「21点」收益 ×2' }] },
  meteor: { icon: '🌠', name: '流星雨', mul: 2.0, desc: '全游戏狂欢', extras: [{ all: true, mul: 1.5, label: '全游戏收益额外 ×1.5' }] }
};
function getWeatherMul(gameId) {
  if (!state.weather) return 1;
  const w = WEATHERS[state.weather.id];
  let m = w.mul;
  w.extras.forEach(e => { if (e.all || e.game === gameId) m *= e.mul || 1; });
  return m;
}
function hasRareBoost(gameId) {
  if (!state.weather) return false;
  return WEATHERS[state.weather.id].extras.some(e => e.rare === gameId);
}
function setWeather(id) {
  const dur = id === 'meteor' ? rand(3, 7) * 60000 : rand(8, 15) * 60000;
  state.weather = { id, until: Date.now() + dur }; save(); renderUI();
  toast(`天气变为【${WEATHERS[id].name}】`, id === 'meteor' ? 'big' : 'ok');
}

/* ==================== 钱包 ==================== */
function addCoin(n, reason = '') {
  if (!n) return;
  state.wallet = Math.max(0, state.wallet + n);
  if (n > 0) state.income += n; else state.outcome += -n;
  if (reason) { state.flow.push({ v: n, reason }); if (state.flow.length > 30) state.flow.shift(); }
  save(); renderUI();
  if (reason) toast(`${n > 0 ? '+' : ''}${n} 🪙 ${reason}`, n > 0 ? 'ok' : 'bad');
}
function spend(n, reason = '消费') {
  if (state.wallet < n) { toast('猪猪币不足', 'bad'); return false; }
  state.wallet -= n; state.outcome += n;
  state.flow.push({ v: -n, reason }); if (state.flow.length > 30) state.flow.shift();
  save(); renderUI(); return true;
}
function earn(gameId, base, reason) {
  const mul = getWeatherMul(gameId);
  const final = Math.floor(base * mul);
  addCoin(final, reason + (mul !== 1 ? ` [×${mul.toFixed(2)}]` : ''));
  return final;
}

/* ==================== 渲染UI ==================== */
function renderUI() {
  if (!state.weather || Date.now() > state.weather.until) {
    const pool = ['sunny', 'sunny', 'sunny', 'rain', 'rain', 'fog', 'storm', 'meteor'];
    setWeather(pick(pool));
  }
  $('#vWallet').textContent = state.wallet;
  const net = state.income - state.outcome;
  $('#tipWallet').innerHTML = `<h4>🪙 流水</h4>
    <div class="row"><span>当前</span><b>${state.wallet}</b></div>
    <div class="row"><span>收入</span><b style="color:var(--ok)">+${state.income}</b></div>
    <div class="row"><span>支出</span><b style="color:var(--bad)">-${state.outcome}</b></div>
    <div class="row"><span>净收益</span><b style="color:${net >= 0 ? 'var(--ok)' : 'var(--bad)'}">${net >= 0 ? '+' : ''}${net}</b></div>
    <hr style="border:0;border-top:1px solid var(--bd);margin:8px 0;">
    ${state.flow.slice(-4).reverse().map(f => `<div style="color:${f.v >= 0 ? 'var(--ok)' : 'var(--bad)'}">${f.v > 0 ? '+' : ''}${f.v} ${f.reason}</div>`).join('') || '<div style="color:var(--dim)">暂无</div>'}`;
  
  const w = WEATHERS[state.weather.id];
  $('#vWeather').textContent = w.name;
  $('#vMul').textContent = 'x' + w.mul.toFixed(2);
  const remain = Math.max(0, state.weather.until - Date.now());
  const mm = Math.floor(remain / 60000), ss = Math.floor(remain % 60000 / 1000);
  $('#tipWeather').innerHTML = `<h4>${w.icon} ${w.name} <span style="float:right;font-size:.75rem;color:var(--dim)">${mm}:${String(ss).padStart(2, '0')}</span></h4>
    <div style="color:var(--dim);margin-bottom:8px;">${w.desc}</div>
    <div class="row"><span>基础倍率</span><b>×${w.mul.toFixed(2)}</b></div>
    <div style="margin:8px 0;color:var(--acc);">额外效果</div>
    ${w.extras.length ? w.extras.map(e => `<div style="color:var(--dim)">· ${e.label}</div>`).join('') : '<div style="color:var(--dim)">无</div>'}`;
}

/* ==================== Toast ==================== */
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3000);
}

/* ==================== 弹窗 ==================== */
let currentCleanup = null;
function openGame(g) {
  if (currentCleanup) { currentCleanup(); currentCleanup = null; }
  $('#pEmoji').textContent = g.emoji;
  $('#pTitle').textContent = g.name;
  $('#pSub').textContent = g.desc;
  $('#overlay').classList.add('on');
  const body = $('#pBody'); body.innerHTML = '';
  try { g.render(body, fn => currentCleanup = fn); } catch (e) { body.innerHTML = `<div style="color:var(--bad)">加载失败：${e.message}</div>`; }
}
function closePanel() {
  if (currentCleanup) { currentCleanup(); currentCleanup = null; }
  $('#overlay').classList.remove('on'); $('#pBody').innerHTML = '';
}

/* ==================== 游戏列表 ==================== */
const GAMES = [];

/* 1. 轮盘 */
GAMES.push({ id: 'roulette', emoji: '🎲', name: '俄罗斯轮盘', desc: '越贪越刺激', hot: true, render(el) {
  let bullet = randInt(0, 5), shots = 0, mult = 1, active = false, log = '';
  const draw = () => {
    el.innerHTML = `<div class="info">6弹巢1子弹，倍率翻倍。<br>当前收益 ×${getWeatherMul('roulette').toFixed(2)}</div>
      <div class="big">${active ? '×' + mult : '准备开始'}</div>
      <div class="row center"><button class="btn gold" id="go">${active ? '继续扣' : '押100开始'}</button><button class="btn grn" id="cash" ${active ? '' : 'disabled'}>收手</button></div>
      <div class="log">${log || '扣下扳机...'}</div>`;
    $('#go', el).onclick = () => {
      if (active) {
        if (shots >= 5) return bust();
        shots++; if (shots === bullet + 1) return bust();
        mult *= 2; log += `\n第${shots}发空弹→×${mult}`; draw();
      } else {
        if (!spend(100, '轮盘')) return;
        bullet = randInt(0, 5); shots = 1; mult = 2; active = true; log = '第1发空弹→×2';
        if (bullet === 0) return bust(); draw();
      }
    };
    $('#cash', el).onclick = () => {
      if (!active) return;
      const got = earn('roulette', 100 * mult, '轮盘收手');
      log += `\n收手+${got}币`; active = false; mult = 1; shots = 0; draw();
    };
  };
  const bust = () => { log += `\n砰！子弹在第${shots + 1}发`; active = false; mult = 1; shots = 0; toast('砰！爆了', 'bad'); draw(); };
  draw();
}});

/* 2. 老虎机 */
GAMES.push({ id: 'slot', emoji: '🎰', name: '老虎机', desc: '转出三同大奖', hot: true, render(el) {
  const SYMS = ['🍒', '🍋', '🍊', '🍇', '💎', '7️⃣'];
  let reels = ['🍒', '🍋', '🍊'], log = '', spinning = false;
  const draw = () => {
    el.innerHTML = `<div class="info">50币/次。三同中奖，💎×10，7️⃣×20。</div>
      <div class="reels">${reels.map(s => `<div class="reel">${s}</div>`).join('')}</div>
      <div class="row center"><button class="btn gold" id="sp" ${spinning ? 'disabled' : ''}>转一次（50币）</button></div>
      <div class="log">${log || '手气如何？'}</div>`;
    $('#sp', el).onclick = () => {
      if (spinning || !spend(50, '老虎机')) return;
      spinning = true; let tick = 0;
      const iv = setInterval(() => {
        reels = reels.map(() => pick(SYMS));
        $$('.reel', el).forEach((r, i) => { r.textContent = reels[i]; r.classList.remove('win'); });
        if (++tick > 12) {
          clearInterval(iv);
          const [a, b, c] = reels;
          let m = 0, n = '';
          if (a === b && b === c) { m = a === '7️⃣' ? 20 : a === '💎' ? 10 : 5; n = '三同！'; }
          else if (a === b || b === c || a === c) { m = 1.5; n = '两同'; }
          if (m > 0) { const got = earn('slot', Math.floor(50 * m), `老虎机${n}`); log = `<span class="ok">${n}+${got}币</span>`; if (m >= 5) $$('.reel', el).forEach(r => r.classList.add('win')); }
          else { log = `<span class="bad">没中</span>`; }
          spinning = false; draw();
        }
      }, 60);
    };
  };
  draw();
}});

/* 3. 猜数字 */
GAMES.push({ id: 'guess', emoji: '🔢', name: '猜数字', desc: '7次内猜中1~100', new: true, render(el) {
  let target = randInt(1, 100), tries = 0, log = '';
  const draw = () => {
    el.innerHTML = `<div class="info">1~100，7次机会，猜错扣次数。</div>
      <div class="big">${tries} / 7</div>

        const out = ch.fn();
        if (out.c) { const got = earn('adventure', out.c, '冒险'); lg.innerHTML += `第${i}步 ${out.e} ${out.t}(+${got})<br>`; }
        else if (out.pig) { const b = mkPig(pick(PIG_SP), pick(PIG_AD), pick(PIG_CL), true); state.pigs.push(b); save(); lg.innerHTML += `第${i}步 ${out.e} 加入新猪${b.a}${b.s}<br>`; }
        else lg.innerHTML += `第${i}步 ${out.e} ${out.t}<br>`;
        lg.scrollTop = lg.scrollHeight; setTimeout(step, 600);
      };
      step();
    };
  };
  draw();
}});

/* 12. 扭蛋 */
GAMES.push({ id: 'gacha', emoji: '🥚', name: '扭蛋机', desc: '收集荒诞组合', render(el) {
  const E = ['🐷', '🐖', '🐗', '🐽', '🥷', '👑', '🐉', '✨'], A = ['发光', '忧郁', '暴躁', '优雅', '肥宅', '神秘', '皇家', '双头', '彩虹', '透明'], C = ['戴帽子', '穿披风', '拿伞', '抱瓜', '踩滑板', '拎灯笼', '系铃铛', '戴墨镜'];
  if (!state.inv.gacha) state.inv.gacha = [];
  let disp = { e: '🥚', n: '待命中', d: '' };
  const draw = () => {
    el.innerHTML = `<div class="info">60币/次。收集各种怪猪。<br>${hasRareBoost('gacha') ? '<span style="color:var(--ok)">浓雾天气：稀有概率提升！</span>' : ''}</div>
      <div class="res"><div class="em">${disp.e}</div><div class="nm">${disp.n}</div><div class="ds">${disp.d}</div></div>
      <div class="row center"><button class="btn gold" id="go">抽一发（60币）</button></div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px">${state.inv.gacha.slice(-16).reverse().map(g => `<div style="background:var(--bg);border:1px solid var(--acc);padding:4px;border-radius:6px;text-align:center;font-size:.65rem"><div style="font-size:1.2rem">${g.e}</div>${g.n}</div>`).join('')}</div>`;
    $('#go', el).onclick = () => {
      if (!spend(60, '扭蛋')) return;
      let e, a;
      if (hasRareBoost('gacha') && Math.random() < 0.3) { e = pick(['🐉', '✨', '👑']); a = pick(['彩虹', '黄金', '双头', '神秘']); }
      else { e = pick(E); a = pick(A); }
      const n = `${a}的${e}${pick(C)}`;
      state.inv.gacha.push({ e, n }); save();
      disp = { e, n, d: '已收集' }; toast(`抽到 ${n}`, 'ok', e); draw();
    };
  };
  draw();
}});

/* 渲染网格和初始化 */
function init() {
  $('#grid').innerHTML = GAMES.map(g => `<div class="card ${g.hot ? 'hot' : ''} ${g.new ? 'new' : ''}" data-id="${g.id}"><div class="em">${g.emoji}</div><div class="nm">${g.name}</div><div class="ds">${g.desc}</div></div>`).join('');
  $$('.card', $('#grid')).forEach(c => c.onclick = () => openGame(GAMES.find(x => x.id === c.dataset.id)));
  $('#pClose').onclick = closePanel;
  $('#overlay').onclick = e => { if (e.target.id === 'overlay') closePanel(); };
  
  $$('#themebar button').forEach(b => b.onclick = () => {
    document.body.className = b.dataset.t === 'dark' ? '' : b.dataset.t;
    $$('#themebar button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#themebar button').classList.add('on');
  
  renderUI(); setInterval(renderUI, 1000);
}
init();
</script>
