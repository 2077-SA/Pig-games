<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猪猪游乐场 · 完整版</title>
<style>
  :root{--bg:#0f0f0f;--card:#1a1a1a;--bd:#333;--fg:#fff;--dim:#888;--acc:#ff9000;--ok:#6cf06c;--bad:#f66;--gold:#fc0;--chip:#1f1f1f;--tip:#151515}
  body.light{--bg:#f2f2f2;--card:#fff;--bd:#e0e0e0;--fg:#1a1a1a;--dim:#777;--chip:#f0f0f0;--tip:#fff}
  body.pink{--bg:#fff5f8;--card:#fff;--bd:#ffd6e5;--fg:#4a2a35;--dim:#a87a90;--chip:#fff0f5;--tip:#fff;--acc:#ff5599}
  body.blue{--bg:#0a1628;--card:#0f1f38;--bd:#1e3a5f;--fg:#d6e8ff;--dim:#9ab4d4;--chip:#122440;--tip:#0f1f38;--acc:#00a8ff}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial','Helvetica',system-ui,sans-serif}
  body{min-height:100vh;background:var(--bg);color:var(--fg);line-height:1.6;transition:background .3s,color .3s}
  header{background:var(--card);border-bottom:2px solid var(--acc);position:sticky;top:0;z-index:100;padding:10px 0}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .logo{font-size:22px;font-weight:bold;display:flex;align-items:center;gap:4px}
  .logo .hub{color:var(--acc)}
  .chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{position:relative;display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--bd);border-radius:22px;padding:5px 14px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .25s;user-select:none}
  .chip:hover{border-color:var(--acc)}
  .chip.flash{animation:cf .6s ease}
  @keyframes cf{0%,100%{transform:scale(1)}50%{transform:scale(1.1);box-shadow:0 0 20px var(--acc)}}
  .chip .ic{font-size:1.05rem;line-height:1}
  .chip .val{color:var(--acc);font-weight:900;letter-spacing:.4px}
  .tip{position:absolute;top:calc(100% + 8px);right:0;min-width:250px;max-width:320px;background:var(--tip);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;font-size:.78rem;font-weight:400;color:var(--fg);box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:0;visibility:hidden;transform:translateY(-6px);transition:all .18s ease;z-index:300;pointer-events:none;text-align:left;line-height:1.65}
  .chip:hover .tip{opacity:1;visibility:visible;transform:translateY(0)}
  .tip::before{content:'';position:absolute;top:-6px;right:24px;width:10px;height:10px;background:var(--tip);border-left:1px solid var(--acc);border-top:1px solid var(--acc);transform:rotate(45deg)}
  .tip h4{font-size:.85rem;color:var(--acc);margin-bottom:8px}
  .tip .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .tip .row b{color:var(--acc);font-weight:800}
  .tip .row .ok{color:var(--ok)} .tip .row .bad{color:var(--bad)}
  .tip .sep{height:1px;background:var(--bd);margin:8px 0}
  .tip .note{color:var(--dim);font-size:.7rem;line-height:1.5}
  .tip .list{font-size:.74rem;color:var(--dim);margin-top:4px}
  .tip .list div{padding:2px 0}
  .tip .list b{color:var(--fg);font-weight:700}
  .themebar{display:flex;gap:3px;background:var(--chip);border:1px solid var(--bd);border-radius:22px;padding:3px}
  .themebar button{border:none;background:transparent;cursor:pointer;font-size:.95rem;padding:4px 9px;border-radius:16px;color:var(--fg);transition:all .2s;line-height:1}
  .themebar button:hover{background:var(--bd)}
  .themebar button.on{background:var(--acc);color:#fff}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
  .hero{text-align:center;margin-bottom:22px}
  .hero h1{font-size:1.8rem;color:var(--acc);letter-spacing:3px;margin-bottom:4px}
  .hero p{color:var(--dim);font-size:.85rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:1rem .9rem;cursor:pointer;transition:all .22s;text-align:left;color:var(--fg);font-family:inherit;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
  .card:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 8px 22px rgba(255,144,0,.15)}
  .card .em{font-size:1.8rem;line-height:1}
  .card .nm{font-size:.9rem;font-weight:800;color:var(--acc);letter-spacing:.4px}
  .card .ds{font-size:.7rem;color:var(--dim);line-height:1.4}
  .card.hot::after{content:'HOT';position:absolute;top:6px;right:8px;font-size:.55rem;font-weight:900;background:linear-gradient(135deg,#ff5500,#ff9000);color:#fff;padding:1px 6px;border-radius:6px}
  .card.new::after{content:'NEW';position:absolute;top:6px;right:8px;font-size:.55rem;font-weight:900;background:linear-gradient(135deg,#00a8ff,#4dd0ff);color:#001a33;padding:1px 6px;border-radius:6px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(5px);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.on{display:flex}
  .panel{background:var(--card);border:2px solid var(--acc);border-radius:18px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;padding:1.4rem 1.5rem;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.8)}
  .panel .head{display:flex;align-items:center;gap:12px;margin-bottom:1rem;padding-bottom:.7rem;border-bottom:2px dashed var(--bd)}
  .panel .head .ph{font-size:2rem;line-height:1}
  .panel .head h3{font-size:1.15rem;color:var(--acc)}
  .panel .head .sub{font-size:.75rem;color:var(--dim);margin-top:2px}
  .panel .close{position:absolute;top:10px;right:14px;background:transparent;border:none;color:var(--dim);font-size:1.6rem;cursor:pointer;line-height:1}
  .panel .close:hover{color:var(--acc)}
  .info{background:var(--chip);border:1px solid var(--bd);border-radius:12px;padding:.7rem .9rem;margin:.5rem 0;font-size:.82rem;line-height:1.7}
  .info b{color:var(--acc)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:.6rem 0}
  .row.center{justify-content:center}
  .btn{background:var(--acc);border:none;border-bottom:4px solid rgba(0,0,0,.35);padding:.45rem 1.2rem;border-radius:30px;color:#fff;font-weight:700;cursor:pointer;font-size:.85rem;font-family:inherit;transition:all .08s}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(3px);border-bottom-width:1px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.sec{background:#555;color:#eee}
  .btn.dan{background:#c33}
  .btn.grn{background:#3a8a3a}
  .btn.gold{background:linear-gradient(135deg,#ff9000,#fc0);color:#000}
  .inp{background:var(--chip);border:1px solid var(--bd);color:var(--acc);padding:.4rem .8rem;border-radius:10px;font-size:.88rem;font-weight:700;outline:none;font-family:inherit;width:110px}
  .log{background:var(--chip);border:1px dashed var(--bd);border-radius:10px;padding:.7rem .9rem;margin:.5rem 0;font-size:.78rem;line-height:1.9;max-height:220px;overflow-y:auto;white-space:pre-wrap}
  .log .ok{color:var(--ok)} .log .bad{color:var(--bad)} .log .big{color:var(--gold);font-weight:800}
  .big{text-align:center;font-size:2.2rem;font-weight:900;color:var(--acc);padding:.4rem 0;letter-spacing:2px;min-height:2.8rem}
  .dice-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:.7rem 0}
  .die{width:50px;height:50px;background:linear-gradient(145deg,#fff,#ddd);color:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;cursor:pointer;transition:all .2s;user-select:none;border:2px solid transparent;box-shadow:0 4px 10px rgba(0,0,0,.35)}
  .die.held{border-color:var(--acc);background:linear-gradient(145deg,#fff8e0,#ffe8b0);transform:translateY(-4px)}
  .reels{display:flex;gap:10px;justify-content:center;margin:1rem 0}
  .reel{width:72px;height:82px;background:var(--chip);border:2px solid var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;transition:all .1s}
  .reel.win{border-color:var(--gold);box-shadow:0 0 18px var(--gold)}
  .pcard{width:56px;height:80px;background:linear-gradient(145deg,#fff,#e8e8e8);color:#111;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.5);border:1px solid #999;font-size:1.2rem}
  .pcard .suit{font-size:1rem} .pcard.red{color:#c22}
  .pcard.back{background:linear-gradient(145deg,#4a2a5a,#2a1a3a);color:var(--gold);font-size:1.4rem}
  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:.5rem 0}
  .slot{background:var(--chip);border:2px dashed var(--bd);border-radius:12px;padding:.7rem .4rem;text-align:center;cursor:pointer;transition:all .2s;font-size:.72rem;color:var(--dim)}
  .slot:hover{border-color:var(--acc);color:var(--acc)}
  .slot.on{border-style:solid;border-color:var(--acc);background:rgba(255,144,0,.1);color:var(--acc);font-weight:700}
  .slot .em{font-size:1.6rem;display:block;margin-bottom:2px}
  .res{text-align:center;padding:1rem;background:var(--chip);border:1px dashed var(--bd);border-radius:12px;margin:.6rem 0;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .res .em{font-size:2.4rem;line-height:1}
  .res .nm{font-weight:800;color:var(--acc);font-size:1rem}
  .res .ds{font-size:.75rem;color:var(--dim)}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:.6rem 0}
  .wcard{background:var(--chip);border:2px solid var(--bd);border-radius:12px;padding:.75rem;text-align:center;transition:all .3s}
  .wcard.on{border-color:var(--acc);box-shadow:0 0 16px rgba(255,144,0,.35)}
  .wcard .wi{font-size:1.9rem}
  .wcard .wn{font-weight:800;font-size:.85rem;color:var(--acc);margin-top:4px}
  .wcard .we{font-size:.68rem;color:var(--dim);margin-top:4px;line-height:1.4}
  .pig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:.7rem 0}
  .pig-card{background:var(--chip);border:2px solid var(--bd);border-radius:12px;padding:.6rem;text-align:center;cursor:pointer;transition:all .2s;position:relative}
  .pig-card:hover{transform:translateY(-2px)}
  .pig-card.sel{border-color:var(--acc);background:rgba(255,144,0,.08)}
  .pig-card .pe{font-size:1.7rem;line-height:1.1}
  .pig-card .pn{font-size:.7rem;font-weight:700;color:var(--acc);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pig-card .ps{font-size:.58rem;color:var(--dim);margin-top:2px;line-height:1.3}
  .pig-card .pr{position:absolute;top:4px;right:6px;font-size:.55rem;font-weight:900;padding:1px 5px;border-radius:6px}
  .pig-card.r1 .pr{background:#444;color:#ccc}
  .pig-card.r2 .pr{background:#1a3a5a;color:#6cb4ff}
  .pig-card.r3 .pr{background:#3a1a5a;color:#c8f}
  .pig-card.r4 .pr{background:#5a3a1a;color:var(--gold)}
  .pig-card.r5 .pr{background:linear-gradient(90deg,#ff9000,#fc0,#ff7eb3);color:#000}
  .pig-card.r6 .pr{background:linear-gradient(90deg,#ff7eb3,#c8f,#4dd0ff,#6cf06c);color:#000}
  .hpbar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:4px}
  .hpbar > div{height:100%;background:var(--ok);transition:width .3s}
  .toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:280px}
  .toast{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:.6rem 1rem;color:var(--fg);font-size:.83rem;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.5);animation:tIn .3s ease;display:flex;align-items:center;gap:8px;pointer-events:auto}
  .toast.ok{border-color:var(--ok)} .toast.bad{border-color:var(--bad)}
  .toast.big{border-color:var(--gold);background:linear-gradient(135deg,#2a2418,var(--card))}
  .toast .em{font-size:1.2rem;line-height:1}
  @keyframes tIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  .toast.out{animation:tOut .28s ease forwards}
  @keyframes tOut{to{opacity:0;transform:translateX(30px)}}
  @media(max-width:600px){
    .wrap{flex-direction:column;align-items:stretch}
    .chips{justify-content:center}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
    .tip{right:auto;left:50%;transform:translateX(-50%) translateY(-6px)}
    .chip:hover .tip{transform:translateX(-50%) translateY(0)}
    .tip::before{right:auto;left:50%;margin-left:-5px}
    .toasts{left:12px;right:12px;max-width:none}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">🐖 <span>猪猪</span><span class="hub">游乐场</span></div>
    <div class="chips">
      <div class="chip" id="walletChip">
        <span class="ic">🪙</span><span class="val" id="walletVal">1000</span>
        <div class="tip" id="walletTip"></div>
      </div>
      <div class="chip" id="weatherChip">
        <span class="ic" id="wcIcon">☀️</span><span id="wcName">晴朗</span>
        <span class="val" id="wcMul">×1.00</span>
        <div class="tip" id="weatherTip"></div>
      </div>
      <div class="themebar" id="themebar">
        <button data-t="dark">🌙</button>
        <button data-t="light">☀️</button>
        <button data-t="pink">🌸</button>
        <button data-t="blue">💙</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h1>🎰 猪猪游乐场</h1>
    <p>悬停右上角查看金币流水与天气详情 · 点击卡片开始游戏</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="panel">
    <button class="close" id="pClose">×</button>
    <div class="head">
      <span class="ph" id="pEmoji">🎲</span>
      <div>
        <h3 id="pTitle">标题</h3>
        <div class="sub" id="pSub">副标题</div>
      </div>
    </div>
    <div id="pBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
/* 全局错误捕获：出错时在页面提示 */
window.addEventListener('error', e => {
  console.error(e.error || e.message);
  const grid = document.getElementById('grid');
  if (grid && !grid.children.length) {
    grid.innerHTML = '<div style="color:#f66;padding:20px;grid-column:1/-1;">⚠️ 加载出错：' + (e.message || '未知错误') + '<br>请刷新页面或反馈。</div>';
  }
});
</script>

<script>
(function(){
'use strict';

/* ==================== 工具 ==================== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ==================== 状态 ==================== */
const KEY = 'piggy-lite-v2';
const state = {
  wallet: 1000, income: 0, outcome: 0, flow: [],
  weather: null, inventory: {}, pigs: null, bullseye: null,
  pranks: 0, lastPrank: 0,
};
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

/* ==================== 天气 ==================== */
const WEATHERS = {
  sunny: {icon:'☀️', name:'晴朗', mul:1.00, color:'#ffcc66', desc:'风和日丽，艾欧泽亚一切正常', extras:[]},
  rain:  {icon:'🌧️', name:'暴雨', mul:1.15, color:'#88bbff', desc:'潮湿的空气让猪猪变得慷慨',
    extras:[{game:'adventure', mul:2, label:'「大冒险」收益 ×2'}]},
  fog:   {icon:'🌫️', name:'浓雾', mul:0.90, color:'#cccccc', desc:'看不清前路，但惊喜藏在雾里',
    extras:[{rareBoost:'gacha', label:'「扭蛋机」稀有组合概率提升'},{rareBoost:'alchemy', label:'「炼金锅」彩蛋配方概率提升'}]},
  storm: {icon:'⛈️', name:'雷暴', mul:1.30, color:'#c8b0ff', desc:'雷电交加，冒险家的狂欢时刻',
    extras:[{game:'roulette', mul:2, label:'「俄罗斯轮盘」收益 ×2'},{game:'bj', mul:2, label:'「21 点」收益 ×2'}]},
  meteor:{icon:'🌠', name:'流星雨', mul:2.00, color:'#ffb0d0', desc:'流星划过，鸿运当头，全游戏狂欢',
    extras:[{all:true, mul:1.5, label:'全游戏收益额外 ×1.5（共 ×3）'}]},
};
const WEATHER_WEIGHTS = {sunny:38, rain:26, fog:18, storm:12, meteor:6};

function pickWeatherId(){
  const total = Object.values(WEATHER_WEIGHTS).reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for (const [id, w] of Object.entries(WEATHER_WEIGHTS)) { r -= w; if (r <= 0) return id; }
  return 'sunny';
}
function setWeather(id){
  const dur = id === 'meteor' ? rand(3,7)*60000 : rand(8,15)*60000;
  state.weather = { id, until: Date.now() + dur };
  save(); renderWeather();
  const w = WEATHERS[id];
  toast(`天气变为【${w.name}】${w.icon}`, id === 'meteor' ? 'big' : 'ok');
}
function weatherMul(gameId){
  if (!state.weather) return 1;
  const w = WEATHERS[state.weather.id];
  let mul = w.mul;
  w.extras.forEach(e => { if (e.all || e.game === gameId) mul *= e.mul || 1; });
  return mul;
}
function hasRareBoost(gameId){
  if (!state.weather) return false;
  return WEATHERS[state.weather.id].extras.some(e => e.rareBoost === gameId);
}
function renderWeather(){
  if (!state.weather || Date.now() > state.weather.until) { setWeather(pickWeatherId()); return; }
  const w = WEATHERS[state.weather.id];
  const remain = Math.max(0, state.weather.until - Date.now());
  const mm = Math.floor(remain/60000), ss = Math.floor(remain%60000/1000);
  const iconEl = $('#wcIcon'), nameEl = $('#wcName'), mulEl = $('#wcMul');
  if (iconEl) iconEl.textContent = w.icon;
  if (nameEl) nameEl.textContent = w.name;
  if (mulEl) mulEl.textContent = '×' + w.mul.toFixed(2);

  const extrasHtml = w.extras.length
    ? w.extras.map(e => `<div>· ${e.label}</div>`).join('')
    : '<div class="note">无额外效果</div>';
  const allList = Object.entries(WEATHERS).map(([id, ww]) => {
    const cur = id === state.weather.id;
    return `<div${cur ? ' style="color:var(--acc);font-weight:700"' : ''}><b style="color:${ww.color}">${ww.icon} ${ww.name}</b> <span style="float:right;">×${ww.mul.toFixed(2)}</span></div>`;
  }).join('');
  const tipEl = $('#weatherTip');
  if (tipEl) tipEl.innerHTML = `
    <h4>${w.icon} ${w.name} <span style="float:right;color:var(--dim);font-size:.75rem;font-weight:400;">剩余 ${mm}:${String(ss).padStart(2,'0')}</span></h4>
    <div class="note" style="margin-bottom:6px;">${w.desc}</div>
    <div class="row"><span>本天气基础倍率</span><b>×${w.mul.toFixed(2)}</b></div>
    <div class="sep"></div>
    <div style="color:var(--fg);font-weight:700;margin-bottom:4px;">额外效果</div>
    <div class="list">${extrasHtml}</div>
    <div class="sep"></div>
    <div class="note" style="margin-bottom:4px;">全部天气对照（当前高亮）</div>
    <div class="list">${allList}</div>
  `;
}

/* ==================== 钱包 ==================== */
function renderWallet(){
  const v = $('#walletVal');
  if (v) v.textContent = state.wallet;
  const net = state.income - state.outcome;
  const flow = state.flow.slice(-5).reverse();
  const tipEl = $('#walletTip');
  if (tipEl) tipEl.innerHTML = `
    <h4>🪙 猪猪币详情</h4>
    <div class="row"><span>当前余额</span><b>${state.wallet}</b></div>
    <div class="row"><span>累计收入</span><b class="ok">+${state.income}</b></div>
    <div class="row"><span>累计支出</span><b class="bad">-${state.outcome}</b></div>
    <div class="row"><span>净收益</span><b style="color:${net >= 0 ? 'var(--ok)' : 'var(--bad)'}">${net >= 0 ? '+' : ''}${net}</b></div>
    <div class="sep"></div>
    <div class="list">
      <div style="color:var(--fg);font-weight:700;margin-bottom:4px;">最近流水</div>
      ${flow.length ? flow.map(f => `<div><b style="color:${f.v >= 0 ? 'var(--ok)' : 'var(--bad)'}">${f.v >= 0 ? '+' : ''}${f.v}</b> ${f.reason}</div>`).join('') : '<div class="note">还没有流水</div>'}
    </div>
  `;
}
function flashWallet(){
  const el = $('#walletChip');
  if (!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}
function addCoin(n, reason){
  reason = reason || '';
  if (!n) return;
  state.wallet = Math.max(0, state.wallet + n);
  if (n > 0) state.income += n; else state.outcome += -n;
  if (reason) {
    state.flow.push({ t: Date.now(), v: n, reason });
    if (state.flow.length > 40) state.flow.shift();
  }
  renderWallet(); save(); flashWallet();
  if (reason) toast((n > 0 ? '+' : '') + n + ' 🪙 ' + reason, n > 0 ? 'ok' : 'bad');
}
function spend(n, reason){
  reason = reason || '消费';
  if (state.wallet < n) { toast('猪猪币不足（需要 ' + n + '）', 'bad'); return false; }
  state.wallet -= n;
  state.outcome += n;
  state.flow.push({ t: Date.now(), v: -n, reason });
  if (state.flow.length > 40) state.flow.shift();
  renderWallet(); save(); flashWallet();
  return true;
}
function earnCoin(gameId, base, reason){
  const mul = weatherMul(gameId);
  const final = Math.max(0, Math.floor(base * mul));
  const tag = mul !== 1 ? ` ×${mul.toFixed(2)}` : '';
  addCoin(final, reason + tag);
  return final;
}

/* ==================== Toast ==================== */
function toast(msg, type, emoji){
  type = type || '';
  emoji = emoji || '';
  const wrap = $('#toasts');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (emoji ? `<span class="em">${emoji}</span>` : '') + `<span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3200);
}

const PIG_SPECIES = [
  { name: '小香猪', emoji: '🐷', rar: 1 },
  { name: '黑毛猪', emoji: '🐗', rar: 1 },
  { name: '花猪', emoji: '🐽', rar: 2 },

  { name: '忍者猪', emoji: '🥷', rar: 3 },

  { name: '星尘猪', emoji: '✨', rar: 5 },
  { name: '猪王', emoji: '👑', rar: 5 },
];
const PIG_ADJ = ['迷你', '巨大', '发光', '忧郁', '暴躁', '优雅', '肥宅', '神秘', '皇家', '双头', '彩虹', '透明', '机械', '幽灵', '黄金', '慵懒', '中二', '社恐'];
const PIG_COLORS = ['#ff99bb','#ffcc66','#88cc88','#88aaff','#cc88ff','#ff8888','#88dddd','#ccaa88','#ffb000','#c8f'];
function makePig(species, adj, color, mut){
  const rar = Math.min(6, (species.rar || 1) + (mut ? 1 : 0) + (adj && ['彩虹','黄金','星尘','龙'].some(k => adj.includes(k)) ? 1 : 0));
  return {
    id: 'pig-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
    species: species.name, emoji: species.emoji, adj, color, rar,
    born: Date.now(),
    stats: { size: randInt(1,99), speed: randInt(1,99), luck: randInt(1,99), power: randInt(1,99) }
  };
}
function defaultPigs(){
  return [
    makePig(PIG_SPECIES[0], pick(PIG_ADJ), pick(PIG_COLORS)),
    makePig(PIG_SPECIES[1], pick(PIG_ADJ), pick(PIG_COLORS)),
  ];
}
if (!state.pigs || state.pigs.length < 2) state.pigs = defaultPigs();
function breedPigs(p1, p2){
  const sp = Math.random() < 0.5 ? PIG_SPECIES.find(s => s.name === p1.species) : PIG_SPECIES.find(s => s.name === p2.species);
  let adj = Math.random() < 0.5 ? p1.adj : p2.adj;
  let mut = false;
  if (Math.random() < 0.18) { adj = pick(PIG_ADJ); mut = true; }
  const color = Math.random() < 0.5 ? p1.color : p2.color;
  const baby = makePig(sp || PIG_SPECIES[0], adj, color, mut);
  baby.stats.size = Math.round((p1.stats.size + p2.stats.size) / 2 + rand(-12,12));
  baby.stats.speed = Math.round((p1.stats.speed + p2.stats.speed) / 2 + rand(-12,12));
  baby.stats.luck = Math.round((p1.stats.luck + p2.stats.luck) / 2 + rand(-12,12));
  baby.stats.power = Math.round((p1.stats.power + p2.stats.power) / 2 + rand(-12,12));
  ['size','speed','luck','power'].forEach(k => { baby.stats[k] = Math.max(1, Math.min(99, baby.stats[k])); });
  if (mut) baby.stats.luck = Math.min(99, baby.stats.luck + 15);
  return baby;
}

  render(el){
    const COST = 50;
    let dice = [1,1,1,1,1];
    let held = [false,false,false,false,false];

    const draw = () => {
      el.innerHTML = `
        <div class="info">掷 5 骰可重掷 2 次。点骰子可锁定。<br>三条 ×2 · 四条 ×4 · 葫芦 ×6 · 顺子 ×8 · 五同 ×20</div>

          <button class="btn gold" id="st" ${active ? 'disabled' : ''}>🎯 开始（${COST} 币）</button>
          <button class="btn" id="rl" ${active && left > 0 ? '' : 'disabled'}>🎲 重掷（${left}）</button>
          <button class="btn grn" id="set" ${active ? '' : 'disabled'}>💰 结算</button>
        </div>
        <div class="log">${log || '点开始，押上 50 币。'}</div>
      `;

        d.onclick = () => {

          const i = +d.dataset.i;
          held[i] = !held[i];
          draw();
        };
      });
      $('#st', el).onclick = () => {
        if (!spend(COST, '骰子赌场')) return;
        dice = Array.from({length: 5}, () => randInt(1,6));
        held = [false,false,false,false,false];
        left = 2; active = true; log = '开始！';
        draw();
      };
      $('#rl', el).onclick = () => {
        if (!active || left <= 0) return;
        for (let i = 0; i < 5; i++) if (!held[i]) dice[i] = randInt(1,6);

      };
      $('#set', el).onclick = () => {
        if (!active) return;
        const counts = {};
        dice.forEach(d => counts[d] = (counts[d] || 0) + 1);
        const vals = Object.values(counts).sort((a,b) => b - a);
        const sorted = [...dice].sort((a,b) => a - b);
        let mul = 0, name = '';
        if (vals[0] === 5) { mul = 20; name = '五同！'; }
        else if (vals[0] === 4) { mul = 4; name = '四条'; }
        else if (vals[0] === 3 && vals[1] === 2) { mul = 6; name = '葫芦'; }
        else if (vals[0] === 3) { mul = 2; name = '三条'; }
        else if (sorted.join('') === '12345' || sorted.join('') === '23456') { mul = 8; name = '顺子！'; }
        if (mul > 0) {
          const got = earnCoin('yz', COST * mul, `骰子 ${name} ×${mul}`);
          log = `<span class="ok">${name} ${dice.join(' ')} → +${got} 币</span>`;
        } else {
          log = `<span class="bad">没凑出组合：${dice.join(' ')}</span>`;
        }
        active = false;
        draw();
      };
    };
    draw();
  },
});

/* ==================== 14. 21 点 ==================== */
GAMES.push({
  id: 'bj', emoji: '🃏', name: '猪猪 21 点', desc: '对赌庄家猪',
  render(el){
    const COST = 80;
    const suits = ['♠','♥','♦','♣'];
    const mk = () => { const s = pick(suits), v = randInt(1,13); return { s, v, red: s === '♥' || s === '♦' }; };
    const cv = c => c.v === 1 ? 11 : (c.v >= 11 ? 10 : c.v);
    const total = h => {
      let t = h.reduce((a, c) => a + cv(c), 0);
      let aces = h.filter(c => c.v === 1).length;
      while (t > 21 && aces > 0) { t -= 10; aces--; }
      return t;
    };
    const html = (c, hid) => {
      if (hid) return `<div class="pcard back">?</div>`;
      const lb = c.v === 1 ? 'A' : (c.v === 11 ? 'J' : (c.v === 12 ? 'Q' : (c.v === 13 ? 'K' : c.v)));
      return `<div class="pcard ${c.red ? 'red' : ''}"><div>${lb}</div><div class="suit">${c.s}</div></div>`;
    };
    let p = [], d = [], active = false, wins = 0, log = '点开始，和猪猪庄家对赌。';
    const draw = () => {
      el.innerHTML = `
        <div class="info">对赌庄家。超过 21 点爆掉。<b>连续赢 3 把</b>有 +500 额外奖励。<br>每次 <b>${COST} 币</b>。当前天气 ×${weatherMul('bj').toFixed(2)}</div>
        <div style="text-align:center;font-size:.8rem;color:var(--dim)">庄家（猪猪）</div>
        <div class="dice-row">${d.map((c, i) => html(c, active && i === 1)).join('')}</div>
        <div class="big">${d.length && !active ? total(d) : (d.length ? '?' : '-')}</div>
        <div style="text-align:center;font-size:.8rem;color:var(--dim)">我</div>
        <div class="dice-row">${p.map(c => html(c)).join('')}</div>
        <div class="big" style="color:var(--ok)">${p.length ? total(p) : '-'}</div>
        <div class="row center">
          <button class="btn gold" id="st" ${active ? 'disabled' : ''}>🃏 开始（${COST} 币）</button>
          <button class="btn" id="hit" ${active ? '' : 'disabled'}>要牌</button>
          <button class="btn sec" id="stand" ${active ? '' : 'disabled'}>停牌</button>
        </div>
        <div class="log">${log}</div>
      `;
      $('#st', el).onclick = () => {
        if (!spend(COST, '21 点')) return;
        p = [mk(), mk()]; d = [mk(), mk()];
        active = true; log = '你的回合，要牌或停牌。';
        draw();
        if (total(p) === 21) setTimeout(stand, 400);
      };
      $('#hit', el).onclick = () => {
        if (!active) return;
        p.push(mk());
        if (total(p) > 21) {
          active = false;
          log = `<span class="bad">💥 爆了！${total(p)} 点，${COST} 币没了</span>`;
          wins = 0; toast('💥 21 点爆了', 'bad', '💀');
        }
        draw();
      };
      $('#stand', el).onclick = stand;
    };
    const stand = () => {
      if (!active) return;
      active = false;
      while (total(d) < 17) d.push(mk());
      const pt = total(p), dt = total(d);
      if (dt > 21 || pt > dt) {
        let got = Math.floor(COST * 2 * weatherMul('bj'));
        wins++;
        if (wins >= 3) { got += 500; log = `<span class="ok">🏆 ${pt} vs ${dt} · +${got} 币（含 3 连胜 +500！）</span>`; wins = 0; }
        else { log = `<span class="ok">✅ ${pt} vs ${dt} · +${got} 币</span>`; }
        addCoin(got, '21点获胜');
      } else if (pt === dt) {
        log = `🤝 平局 ${pt} vs ${dt} · 退回 ${COST} 币`;
        addCoin(COST, '21点平局');
      } else {
        log = `<span class="bad">😢 ${pt} vs ${dt} · ${COST} 币没了</span>`;
        wins = 0;
      }
      draw();
    };
    draw();
  },
});

/* ==================== 恶作剧实现 ==================== */
const PRANKS = [
  { w: 14, fn: () => { const n = randInt(20,100); if (state.wallet < n) return; addCoin(-n, '被猪猪偷走了'); } },
  { w: 14, fn: () => { addCoin(randInt(30,150), '猪猪送你的'); } },
  { w: 12, fn: () => { toast('猪猪在角落拉了一坨……别看了', 'bad', '💩'); } },
  { w: 10, fn: () => { toast('猪猪说：今天不宜贪，快去玩别的', 'bad', '😜'); } },
  { w: 10, fn: () => { addCoin(randInt(100,200), '流星雨小费'); } },
  { w: 9, fn: () => { document.body.style.filter = 'hue-rotate(180deg)'; setTimeout(() => document.body.style.filter = '', 1800); toast('猪猪给你调了个色……', '', '🎨'); } },
  { w: 8, fn: () => { toast('猪猪在你耳边咕哝：今天运势不错哦', 'ok', '🐷'); } },
  { w: 8, fn: () => { toast('猪猪蹭了蹭你，给你带来温暖', 'ok', '💗'); } },
  { w: 7, fn: () => { addCoin(-50, '猪猪拿去交学费了'); } },
  { w: 5, fn: () => { toast('🐷🐷🐷 三只猪猪同时出现！', 'big', '✨'); document.body.style.transition = 'filter 1s'; document.body.style.filter = 'saturate(2)'; setTimeout(() => document.body.style.filter = '', 1500); } },
];
const PRANK_TOTAL = PRANKS.reduce((a, b) => a + b.w, 0);
function runPrank(force){
  if (!force && Date.now() - (state.lastPrank || 0) < 2 * 60000) return;
  if (!force && Math.random() > 0.55) return;
  state.lastPrank = Date.now();
  state.pranks = (state.pranks || 0) + 1;
  save();
  let r = Math.random() * PRANK_TOTAL;
  for (const p of PRANKS) { r -= p.w; if (r <= 0) { p.fn(); return; } }
}
setInterval(() => runPrank(false), 45000);
setTimeout(() => runPrank(false), 20000);

}
